name: Website quality (no deployment)
on:
  pull_request:
  push:
    branches:
      - main
      - 'policy/**'
      - 'review/**'
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
      # Push checks use the push SHA; PR checks use GitHub's synthetic merge SHA.
      EXPECTED_RELEASE_SHA: ${{ github.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Policy and repository hygiene
        run: npm run check:policy
      - name: Provenance and production-target tests
        run: |
          npm run test:provenance
          npm run test:production-targets
      - name: Staging build and classified link audit
        run: |
          mkdir -p .release-evidence
          npm run build
          npm run check
          npm run check:release -- .release-evidence/staging-manifest.json
          npm run test:release-cli
          npm run audit:links -- --output .release-evidence/links.json
          npm run check:runtime -- .release-evidence/staging-runtime.json
      - name: Browser, enquiry simulations and accessibility
        run: npm test
      - name: Isolated production build and asset-router checks (local only)
        run: |
          sha256sum dist/release.json dist/robots.txt dist/index.html > .release-evidence/staging-before-production.sha256
          npm run build:production
          npm run check:production -- .release-evidence/production-manifest.json
          npm run check:runtime:production -- .release-evidence/production-runtime.json
          npm run check:runtime:apex -- .release-evidence/apex-runtime.json
          sha256sum --check .release-evidence/staging-before-production.sha256
      - name: Restore safe staging output
        if: always()
        run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            .release-evidence/
            test-results/
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
